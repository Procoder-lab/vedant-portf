<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vedant | Portfolio</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="projects-data.js"></script>

    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --accent: #6c5ce7;
            --text: #ffffff;
            --text-muted: #a0a5b5;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            user-select: none;
            /* Prevents text selection inspection */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 40px auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .section-title {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            font-size: 1.3rem;
            color: var(--text-muted);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto 50px auto;
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .project-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #121420;
        }

        .project-title {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        pre {
            background: #11131f;
            padding: 14px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.85rem;
            max-height: 180px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-family: var(--font-mono);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <header>
        <div class="brand-title">VEDANT PORTFOLIO</div>
        <div class="nav-links">
            <a href="projects.html" class="btn">Projects</a>
        </div>
    </header>

    <main>
        <h2 class="section-title">Featured Projects</h2>
        <div id="projectsContainer" class="projects-grid">
            <p style="color:var(--text-muted);">Loading projects...</p>
        </div>
    </main>

    <footer>
        &copy; Vedant. All Rights Reserved.
    </footer>

    <script>
        // ----------------------------------------------------
        // 1. SUPABASE CLIENT CONFIGURATION
        // ----------------------------------------------------
        const SUPABASE_URL = 'https://pcscuwbjndjclknskohi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjc2N1d2JqbmRqY2xrbnNrb2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDE4MDQsImV4cCI6MjEwMDk3NzgwNH0.3ubU4CAxiTkG9GzG_BWgW7Wbth0ZPBpmaDpO5r-rDrY';

        let dbClient = null;
        if (typeof supabase !== 'undefined' && SUPABASE_URL !== '') {
            dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: { persistSession: false },
                global: { headers: { 'x-application-name': 'portfolio-web-app' } }
            });
        }

        // ----------------------------------------------------
        // 2. FETCH PROJECTS (SMART AUTOMATIC FALLBACK)
        // ----------------------------------------------------
        async function fetchProjectsFromDatabase() {
            const container = document.getElementById('projectsContainer');
            if (!container) return;

            // Try Supabase First
            if (dbClient) {
                try {
                    const { data: projects, error } = await dbClient
                        .from('projects')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (!error && projects && projects.length > 0) {
                        renderProjectsList(projects);
                        return;
                    }
                } catch (err) {
                    console.log("Mobile carrier/DNS blocked Supabase API. Utilizing local backup...");
                }
            }

            // Automatic Fallback to Local Backup (100% Mobile Reliable)
            if (window.localProjectsBackup && window.localProjectsBackup.length > 0) {
                renderProjectsList(window.localProjectsBackup);
            } else {
                container.innerHTML = '<p style="color:var(--text-muted);">No projects available.</p>';
            }
        }

        // ----------------------------------------------------
        // 3. RENDER PROJECTS LIST
        // ----------------------------------------------------
        function renderProjectsList(projects) {
            const container = document.getElementById('projectsContainer');
            container.innerHTML = '';

            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';

                const imgUrl = project.image_url || './bg-img.jpg';

                card.innerHTML = `
          <img 
            src="${imgUrl}" 
            alt="${project.title}" 
            class="project-img" 
            onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e1e2e/ffffff?text=Project+Preview';" 
          />
          <h3 class="project-title">${project.title}</h3>
          <p class="project-desc">${project.description || ''}</p>
          ${project.code_snippet ? `<pre><code>${escapeHtml(project.code_snippet)}</code></pre>` : ''}
        `;

                container.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ----------------------------------------------------
        // 4. FRONT-END INSPECTION BLOCKER (SECURITY)
        // ----------------------------------------------------
        // Block Right-Click Context Menu
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // Block F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S
        document.addEventListener('keydown', (e) => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'i')) ||
                (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))
            ) {
                e.preventDefault();
                return false;
            }
        });

        // Initialize Fetch on Page Load
        window.addEventListener('DOMContentLoaded', fetchProjectsFromDatabase);
    </script>
</body>

</html>
