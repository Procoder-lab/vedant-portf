<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vedant | All Projects</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="projects-data.js"></script>

  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: #1a1d2d;
      --accent: #6c5ce7;
      --text: #ffffff;
      --text-muted: #a0a5b5;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      user-select: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto 40px auto;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 0 auto 50px auto;
    }

    .project-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
    }

    .project-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
      background-color: #121420;
    }

    .project-title {
      font-size: 1.25rem;
      margin-bottom: 10px;
    }

    .project-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    pre {
      background: #11131f;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.85rem;
      max-height: 180px;
      font-family: var(--font-mono);
    }

    footer {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      max-width: 1100px;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <header>
    <div class="brand-title">All Projects</div>
    <a href="index.html" class="btn">Home</a>
  </header>

  <main>
    <div id="projectsContainer" class="projects-grid">
      <p style="color:var(--text-muted);">Loading projects...</p>
    </div>
  </main>

  <footer>
    &copy; Vedant. All Rights Reserved.
  </footer>

  <script>
    const SUPABASE_URL = 'https://pcscuwbjndjclknskohi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjc2N1d2JqbmRqY2xrbnNrb2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDE4MDQsImV4cCI6MjEwMDk3NzgwNH0.3ubU4CAxiTkG9GzG_BWgW7Wbth0ZPBpmaDpO5r-rDrY';

    let dbClient = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL !== '') {
      dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false },
        global: { headers: { 'x-application-name': 'portfolio-web-app' } }
      });
    }

    async function fetchProjectsFromDatabase() {
      const container = document.getElementById('projectsContainer');
      if (!container) return;

      if (dbClient) {
        try {
          const { data: projects, error } = await dbClient
            .from('projects')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && projects && projects.length > 0) {
            renderProjectsList(projects);
            return;
          }
        } catch (err) {
          console.log("Mobile carrier blocked Supabase API. Utilizing local backup...");
        }
      }

      if (window.localProjectsBackup && window.localProjectsBackup.length > 0) {
        renderProjectsList(window.localProjectsBackup);
      } else {
        container.innerHTML = '<p style="color:var(--text-muted);">No projects available.</p>';
      }
    }

    function renderProjectsList(projects) {
      const container = document.getElementById('projectsContainer');
      container.innerHTML = '';

      projects.forEach(project => {
        const card = document.createElement('div');
        card.className = 'project-card';

        const imgUrl = project.image_url || './bg-img.jpg';

        card.innerHTML = `
          <img 
            src="${imgUrl}" 
            alt="${project.title}" 
            class="project-img" 
            onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e1e2e/ffffff?text=Project+Preview';" 
          />
          <h3 class="project-title">${project.title}</h3>
          <p class="project-desc">${project.description || ''}</p>
          ${project.code_snippet ? `<pre><code>${escapeHtml(project.code_snippet)}</code></pre>` : ''}
        `;

        container.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Security Inspection Blocker
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'i')) ||
        (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))
      ) {
        e.preventDefault();
        return false;
      }
    });

    window.addEventListener('DOMContentLoaded', fetchProjectsFromDatabase);
  </script>
</body>

</html>
