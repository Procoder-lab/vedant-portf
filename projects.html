<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects Archive — Vedant Dhake</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Syne:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #050505;
      --surface: #0e0e10;
      --surface-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-muted: #888888;
      --font-display: 'Syne', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--surface-border);
      background: rgba(5, 5, 5, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: var(--font-mono);
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .projects-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .title-bar {
      margin-bottom: 2rem;
    }

    .title-bar h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .search-box {
      width: 100%;
      max-width: 500px;
      position: relative;
      margin-bottom: 2.5rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: #fff;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 260px;
    }

    .project-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
    }

    .project-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .btn {
      padding: 0.8rem 1.2rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      background: transparent;
      color: #fff;
      border: 1px solid var(--surface-border);
    }

    .btn-white {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5000;
      padding: 1rem;
    }

    .modal-box {
      background: #0a0a0c;
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      width: 100%;
      max-width: 750px;
      padding: 1.8rem;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <a href="index.html" class="logo"><i class="fa-solid fa-arrow-left"></i> Home</a>
      <span style="color: var(--surface-border);">|</span>
      <span style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);">Projects Archive</span>
    </div>
    <button class="btn btn-white" onclick="openUploadModal()">+ Upload</button>
  </header>

  <main class="projects-container">
    <div class="title-bar">
      <h1>All Projects</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">A complete repository of every application and project
        I've built.</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search projects by name..." oninput="filterProjects()" />
    </div>

    <div class="projects-grid" id="projectsContainer"></div>
  </main>

  <div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('uploadModal')">&times;</button>
      <h3 style="font-family:var(--font-display); font-size:1.5rem; margin-bottom:1.2rem;">UPLOAD PROJECT</h3>
      <form onsubmit="handleUpload(event)">
        <div class="form-group"><label>Project Title</label><input type="text" id="pTitle" required
            placeholder="e.g. Portfolio v1" /></div>
        <div class="form-group"><label>Description</label><textarea id="pDesc" rows="3" required
            placeholder="Brief detail about what you built..."></textarea></div>
        <div class="form-group"><label>Upload Screenshot / Image File</label><input type="file" id="pImageFile"
            accept="image/*" required style="padding:0.6rem;" /></div>
        <div class="form-group"><label>Code Snippet</label><textarea id="pCode" rows="4" required
            placeholder="// Paste your project code here"></textarea></div>
        <button type="submit" class="btn btn-white" style="width:100%; justify-content:center;">Save to
          Portfolio</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="viewModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('viewModal')">&times;</button>
      <h3 id="viewTitle" style="font-family:var(--font-display); font-size:1.5rem; margin-bottom:1.2rem;">PROJECT
        DETAILS</h3>

      <div style="display:flex; gap:0.8rem; border-bottom:1px solid var(--surface-border); margin-bottom:1.2rem;">
        <button class="btn" id="tabOutput" onclick="switchModalTab('output')">Project Preview</button>
        <button class="btn" id="tabCode" onclick="switchModalTab('code')">Source Code</button>
      </div>

      <div id="modalOutputContent">
        <div
          style="width:100%; max-height:400px; border:1px solid var(--surface-border); border-radius:8px; overflow:hidden; background:#000; display:flex; justify-content:center; align-items:center;">
          <img id="projectPreviewImage" src="" alt="Project Screenshot"
            style="width:100%; height:100%; object-fit:contain; max-height:400px;" />
        </div>
      </div>

      <div id="modalCodeContent" style="display:none;">
        <div
          style="background:#000; padding:1rem; border-radius:8px; font-family:var(--font-mono); color:#00ff66; white-space:pre-wrap; max-height:300px; overflow-y:auto; font-size:0.8rem;"
          id="terminalCodeSnippet"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pcscuwbjndjclknskohi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjc2N1d2JqbmRqY2xrbnNrb2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDE4MDQsImV4cCI6MjEwMDk3NzgwNH0.3ubU4CAxiTkG9GzG_BWgW7Wbth0ZPBpmaDpO5r-rDrY';
    const ADMIN_PASSWORD = "DISHAVEDANT";

    let dbClient = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL !== 'YOUR_SUPABASE_PROJECT_URL') {
      dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    window.currentProjects = [];

    document.addEventListener('DOMContentLoaded', fetchProjectsFromDatabase);

    async function fetchProjectsFromDatabase() {
      const container = document.getElementById('projectsContainer');
      if (!dbClient) {
        container.innerHTML = '<p style="color:var(--text-muted); font-family:var(--font-mono);">Configure Supabase credentials first.</p>';
        return;
      }

      const { data: projects, error } = await dbClient.from('projects').select('*').order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p style="color:red; font-family:var(--font-mono);">Failed to fetch projects.</p>';
        return;
      }

      window.currentProjects = projects || [];
      renderProjectsList(window.currentProjects);
    }

    function renderProjectsList(projects) {
      const container = document.getElementById('projectsContainer');
      container.innerHTML = '';

      if (projects.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); font-family:var(--font-mono);">No matching projects found.</p>';
        return;
      }

      projects.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.innerHTML = `
          <div>
            <div class="project-title">${p.title}</div>
            <div class="project-desc">${p.description}</div>
          </div>
          <button class="btn" onclick="openProjectByIndex(${index})">View Project</button>
        `;
        container.appendChild(card);
      });
    }

    function filterProjects() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = window.currentProjects.filter(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
      renderProjectsList(filtered);
    }

    function openProjectByIndex(index) {
      const project = window.currentProjects[index];
      if (!project) return;

      document.getElementById('viewTitle').innerText = project.title;
      document.getElementById('projectPreviewImage').src = project.image_url || project.demo_url || '';
      document.getElementById('terminalCodeSnippet').innerText = project.code_snippet || '// No code provided';

      switchModalTab('output');
      document.getElementById('viewModal').style.display = 'flex';
    }

    function openUploadModal() {
      const userPass = prompt("Enter Admin Password to Upload Projects:");
      if (userPass === ADMIN_PASSWORD) {
        document.getElementById('uploadModal').style.display = 'flex';
      } else if (userPass !== null) {
        alert("Unauthorized access! Incorrect password.");
      }
    }

    async function handleUpload(e) {
      e.preventDefault();
      if (!dbClient) return alert('Configure Supabase credentials first!');

      const title = document.getElementById('pTitle').value;
      const description = document.getElementById('pDesc').value;
      const fileInput = document.getElementById('pImageFile');
      const code_snippet = document.getElementById('pCode').value;

      if (!fileInput.files || fileInput.files.length === 0) return alert('Select an image file!');

      const file = fileInput.files[0];
      const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;

      try {
        const { error: uploadError } = await dbClient.storage.from('project-screenshots').upload(fileName, file);
        if (uploadError) return alert('Image upload failed: ' + uploadError.message);

        const { data: urlData } = dbClient.storage.from('project-screenshots').getPublicUrl(fileName);
        const imageUrl = urlData.publicUrl;

        const { error: dbError } = await dbClient.from('projects').insert([{ title, description, image_url: imageUrl, demo_url: imageUrl, code_snippet }]);

        if (dbError) {
          alert('Database error: ' + dbError.message);
        } else {
          alert('Project uploaded successfully!');
          closeModal('uploadModal');
          document.querySelector('#uploadModal form').reset();
          fetchProjectsFromDatabase();
        }
      } catch (err) {
        alert('Upload failed.');
      }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function switchModalTab(tab) {
      if (tab === 'output') {
        document.getElementById('modalOutputContent').style.display = 'block';
        document.getElementById('modalCodeContent').style.display = 'none';
      } else {
        document.getElementById('modalOutputContent').style.display = 'none';
        document.getElementById('modalCodeContent').style.display = 'block';
      }
    }
  </script>
</body>

</html>
