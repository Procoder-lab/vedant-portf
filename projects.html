<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects Repository — Vedant Dhake</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #050505;
      --surface: #0e0e10;
      --surface-border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-muted: #888888;
      --font-display: 'Syne', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); }

    header {
      padding: 1.5rem 4rem; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--surface-border); background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
    }

    .logo { font-family: var(--font-mono); text-decoration: none; color: #fff; font-weight: 600; text-transform: uppercase; }

    .projects-container { max-width: 1400px; margin: 0 auto; padding: 4rem 4rem; }
    .title-bar { margin-bottom: 3rem; }
    .title-bar h1 { font-family: var(--font-display); font-size: 3.5rem; text-transform: uppercase; margin-bottom: 1rem; }

    .search-box { width: 100%; max-width: 500px; position: relative; margin-bottom: 3rem; }
    .search-box input { width: 100%; padding: 1rem 1.5rem; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; color: #fff; font-family: var(--font-mono); font-size: 0.9rem; }
    .search-box input:focus { outline: none; border-color: #fff; }

    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem; }
    .project-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 12px; padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; min-height: 280px; transition: transform 0.3s, border-color 0.3s; }
    .project-card:hover { border-color: #fff; transform: translateY(-5px); }
    .project-title { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 0.8rem; text-transform: uppercase; }
    .project-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }

    .btn { padding: 0.8rem 1.5rem; font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; background: transparent; color: #fff; border: 1px solid var(--surface-border); transition: all 0.2s; }
    .btn:hover { border-color: #fff; background: rgba(255,255,255,0.05); }
    .btn-white { background: #fff; color: #000; border-color: #fff; }
    .btn-white:hover { background: #e5e5e5; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 5000; }
    .modal-box { background: #0a0a0c; border: 1px solid var(--surface-border); border-radius: 12px; width: 95%; max-width: 900px; padding: 2.5rem; position: relative; }
    .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .terminal-code { background: #000; border: 1px solid var(--surface-border); padding: 1.5rem; border-radius: 8px; font-family: var(--font-mono); font-size: 0.85rem; color: #00ff66; white-space: pre-wrap; max-height: 350px; overflow-y: auto; }

    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; }
    .form-group input, .form-group textarea { width: 100%; padding: 1rem; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 6px; color: #fff; font-family: var(--font-mono); }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 2rem;">
      <a href="index.html" class="logo"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
      <span style="color: var(--surface-border);">|</span>
      <span style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-muted);">Vedant's Portfolio.dev</span>
    </div>
    <button class="btn btn-white" onclick="openUploadModal()">+ Upload Project</button>
  </header>

  <main class="projects-container">
    <div class="title-bar">
      <h1>All Projects</h1>
      <p style="color: var(--text-muted);">A complete repository of every application and project I've built.</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search projects by keyword..." oninput="filterProjects()" />
    </div>

    <div class="projects-grid" id="projectsContainer">
      <p style="color:var(--text-muted); font-family:var(--font-mono);">Connecting to Cloud Database...</p>
    </div>
  </main>

  <div class="modal-overlay" id="uploadModal">
    <div class="modal-box" style="max-width: 650px;">
      <button class="modal-close" onclick="closeModal('uploadModal')">&times;</button>
      <h3 style="font-family:var(--font-display); font-size:1.8rem; margin-bottom:1.5rem;">UPLOAD PROJECT</h3>
      <form onsubmit="handleUpload(event)">
        <div class="form-group"><label>Project Title</label><input type="text" id="pTitle" required placeholder="e.g. Portfolio v1" /></div>
        <div class="form-group"><label>Description</label><textarea id="pDesc" rows="3" required placeholder="Brief detail about what you built..."></textarea></div>
        <div class="form-group"><label>Output Demo URL</label><input type="url" id="pUrl" required placeholder="https://demo-link.com" /></div>
        <div class="form-group"><label>Code Snippet</label><textarea id="pCode" rows="4" required placeholder="// Paste your project code here"></textarea></div>
        <button type="submit" class="btn btn-white" style="width:100%;">Save to Portfolio</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="viewModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('viewModal')">&times;</button>
      <h3 id="viewTitle" style="font-family:var(--font-display); font-size:1.8rem; margin-bottom:1.5rem;">PROJECT DETAILS</h3>
      
      <div style="display:flex; gap:1rem; border-bottom:1px solid var(--surface-border); margin-bottom:1.5rem;">
        <button class="btn" id="tabOutput" onclick="switchModalTab('output')">Live Output</button>
        <button class="btn" id="tabCode" onclick="switchModalTab('code')">Source Code</button>
      </div>

      <div id="modalOutputContent">
        <div style="width:100%; height:400px; border:1px solid var(--surface-border); border-radius:8px; overflow:hidden; background:#fff;">
          <iframe id="projectIframe" src="" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <div style="margin-top:1rem; text-align:right;">
          <a id="demoUrlBtn" href="#" target="_blank" class="btn">Open in New Tab <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
        </div>
      </div>

      <div id="modalCodeContent" style="display:none;">
        <div class="terminal-code" id="terminalCodeSnippet"></div>
      </div>
    </div>
  </div>

  <script>
    // SUPABASE CONFIGURATION
    const SUPABASE_URL = 'https://pcscuwbjndjclknskohi.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjc2N1d2JqbmRqY2xrbnNrb2hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDE4MDQsImV4cCI6MjEwMDk3NzgwNH0.3ubU4CAxiTkG9GzG_BWgW7Wbth0ZPBpmaDpO5r-rDrY';
    const ADMIN_PASSWORD = "DISHAVEDANT";

    let supabaseClient = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL !== 'YOUR_SUPABASE_PROJECT_URL') {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let allProjects = [];

    document.addEventListener('DOMContentLoaded', loadAllProjects);

    async function loadAllProjects() {
      const container = document.getElementById('projectsContainer');
      if (!supabaseClient) {
        container.innerHTML = '<p style="color:var(--text-muted); font-family:var(--font-mono);">Please configure your Supabase keys to load projects.</p>';
        return;
      }

      const { data, error } = await supabaseClient.from('projects').select('*').order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p style="color:red; font-family:var(--font-mono);">Failed to connect to database.</p>';
        return;
      }

      allProjects = data || [];
      renderProjectsList(allProjects);
    }

    function renderProjectsList(projects) {
      const container = document.getElementById('projectsContainer');
      container.innerHTML = '';

      if (projects.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); font-family:var(--font-mono);">No matching projects found.</p>';
        return;
      }

      projects.forEach(p => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.innerHTML = `
          <div>
            <div class="project-title">${p.title}</div>
            <div class="project-desc">${p.description}</div>
          </div>
          <button class="btn" onclick="viewProject('${p.title}', '${p.demo_url}', \`${p.code_snippet}\`)">View Project</button>
        `;
        container.appendChild(card);
      });
    }

    function filterProjects() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProjects.filter(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
      renderProjectsList(filtered);
    }

    function openUploadModal() {
      const userPass = prompt("Enter Admin Password to Upload Projects:");
      if (userPass === ADMIN_PASSWORD) {
        document.getElementById('uploadModal').style.display = 'flex';
      } else if (userPass !== null) {
        alert("Unauthorized access! Incorrect password.");
      }
    }

    async function handleUpload(e) {
      e.preventDefault();
      if (!supabaseClient) return alert('Configure Supabase first!');

      const title = document.getElementById('pTitle').value;
      const description = document.getElementById('pDesc').value;
      const demo_url = document.getElementById('pUrl').value;
      const code_snippet = document.getElementById('pCode').value;

      const { error } = await supabaseClient.from('projects').insert([{ title, description, demo_url, code_snippet }]);

      if (error) {
        alert('Upload failed: ' + error.message);
      } else {
        alert('Project uploaded to Cloud Database!');
        closeModal('uploadModal');
        document.querySelector('#uploadModal form').reset();
        loadAllProjects();
      }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function viewProject(title, url, code) {
      document.getElementById('viewTitle').innerText = title;
      document.getElementById('projectIframe').src = url;
      document.getElementById('demoUrlBtn').href = url;
      document.getElementById('terminalCodeSnippet').innerText = code;
      switchModalTab('output');
      document.getElementById('viewModal').style.display = 'flex';
    }

    function switchModalTab(tab) {
      if (tab === 'output') {
        document.getElementById('modalOutputContent').style.display = 'block';
        document.getElementById('modalCodeContent').style.display = 'none';
      } else {
        document.getElementById('modalOutputContent').style.display = 'none';
        document.getElementById('modalCodeContent').style.display = 'block';
      }
    }
  </script>
</body>
</html>
